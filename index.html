const money = new Intl.NumberFormat('ja-JP');

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
}

const paragraph = html => '<p style="margin:0 0 12px;font-size:15px;line-height:1.8">' + html + '</p>';
const heading = title => '<h2 style="margin:0 0 10px;font-size:19px;line-height:1.5;color:#132842">' + title + '</h2>';
const link = (url, label) => '<a href="' + url + '" style="color:#1263a2;text-decoration:underline">' + label + '</a>';
const card = html => '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 20px"><tr><td bgcolor="#edf6ff" style="padding:17px;border:1px solid #c5dff4">' + html + '</td></tr></table>';

function render() {
  const name = get('customer').value.trim();
  const selected = campaigns[campaign.value];
  const payouts = selected?.payouts ?? [];
  const portability = get('phone').checked;
  const salutation = escapeHtml(name ? (/様$/.test(name) ? name : name + ' 様') : '〇〇 様');
  let benefits = '';
  if (payouts.length) {
    const lines = payouts.map(([months, amount], index) => paragraph(
      '<strong>' + (payouts.length > 1 ? (index + 1) + '回目　' : '') + money.format(amount) + '円</strong><br>ご利用開始日の' + months + 'か月後の同日から45日間'
    ));
    benefits = card(heading('キャッシュバックのお受け取り') +
      paragraph('合計 <strong>' + money.format(payouts.reduce((sum, [, amount]) => sum + amount, 0)) + '円</strong>') + lines.join('') +
      paragraph((payouts.length > 1 ? '各回の期間内に' : '期間内に') + '、NUROマイページからお受け取りのお手続きをお願いいたします。<br>ご利用開始から' + selected.deadline + 'か月後の月末までに、連絡先メールアドレスとお支払い方法の登録が必要です。'));
  }
  if (selected?.support) {
    benefits += card(heading('お乗り換え時の違約金サポート（最大70,000円）') +
      paragraph('ご利用開始月を1か月目として、7か月目の月末までにお支払い方法をご登録ください。<br>NUROから届く「解約違約金証明書貼付シート」に証明書類のコピーを添え、シート発送から2か月後の月末必着でご返送ください。<br>特典のお受け取り案内がEメールで届きましたら、手続きが可能になってから45日間以内にNUROマイページでお受け取り口座をご登録ください。'));
  }
  const payment = card(heading('契約内容通知書が届いたら、すぐにお支払い方法をご登録ください') +
    paragraph('お申し込み手続き完了後、約1週間〜10日で「契約内容通知書」が郵送で届きます。<br><strong>書面が届きましたら、その日のうちにお手続きください。</strong><br>連絡先メールアドレスは、お申込書にご記入いただいたものを弊社にて登録済みです。') +
    paragraph('1. 書面に記載されたログインIDとパスワードをご確認ください。<br>2. NUROマイページ、または「NURO 光」アプリにログインしてください。<br>3. お支払い方法をご登録ください。NUROマイページでは「ご契約情報」→「お支払い情報の登録・変更」からお手続きいただけます。') +
    (payouts.length ? paragraph('<strong>所定の期限までに登録が完了していない場合、対象の特典をお受け取りいただけません。</strong>') : '') +
    '<a href="' + paymentUrl + '" style="display:inline-block;background:#1263a2;color:#fff;padding:10px 14px;font-size:14px;font-weight:bold;text-decoration:none">お支払い方法の登録手順を見る →</a>');
  const notices = heading('今後のご連絡') +
    paragraph('ソニーネットワークコミュニケーションズからのSMSとEメールをご確認ください。') +
    paragraph('<strong>SMS（ショートメッセージ）</strong>　インターネットの開通工事に関するご案内<br><strong>Eメール</strong>　NURO 光のご利用開始日などのご案内' +

    '<br>Email：' + link('mailto:info@nexus-c.co.jp','info@nexus-c.co.jp') + '<br>URL：' + link('https://nexus-c.co.jp/','https://nexus-c.co.jp/') + '</td></tr></table>';
  preview.innerHTML = '<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;margin:auto;border:1px solid #29415d;font-family:Arial,Meiryo,sans-serif;color:#14263c"><tr><td bgcolor="#081321" background="' + brandBackground + '" style="background-color:#081321;background-image:linear-gradient(90deg,#081321 12%,rgba(8,19,33,.93) 50%,rgba(8,19,33,.53)),url(' + brandBackground + ');background-position:right center;background-size:cover;background-repeat:no-repeat;padding:32px 24px;border-bottom:4px solid #269df0;color:#fff"><img src="' + logoUrl + '" width="114" alt="InTech" style="vertical-align:middle;margin-right:10px"> <span style="font-size:13px;color:#fff">株式会社インテック</span><h1 style="font-size:24px;line-height:1.45;margin:18px 0 0;color:#fff">NURO 光のお申し込み<br>ありがとうございます</h1>' +
    '<div style="padding:20px 0 4px;color:#fff">' + paragraph(salutation) + paragraph('このたびは、株式会社インテックを通じてNURO 光をお申し込みいただき、誠にありがとうございます。<br>今回のお申し込みには、<strong>ご利用開始月の月額基本料金が無料になる特典</strong>がついています。') + '</div></td></tr><tr><td bgcolor="#ffffff" style="padding:20px 16px;color:#14263c">' +
    payment + notices + benefits + paragraph('お手続きや工事についてご不明な点がございましたら、株式会社インテックまでお気軽にお問い合わせください。<br>今後ともよろしくお願いいたします。') + paragraph('このメールは送信専用です。<br>お問い合わせは ' + link('mailto:info@nexus-c.co.jp', 'info@nexus-c.co.jp') + ' までお願いいたします。') + signature + '</td></tr></table>';
  const incomplete = !name || !selected;
  get('copy-body').disabled = incomplete;
  get('copy-text').disabled = incomplete;
  get('guide').hidden = !incomplete;
  status.textContent = '';
}

function textBody() {
  const copy = preview.cloneNode(true);
  for (const anchor of copy.querySelectorAll('a')) {
    if (anchor.href.startsWith('https:') && anchor.textContent !== anchor.href) {
      anchor.append('　' + anchor.href);
    }
  }
  copy.style.position = 'fixed';
  copy.style.left = '-200vw';
  document.body.append(copy);
  const text = copy.innerText;
  copy.remove();
  return text;
}

function legacyCopy(content, rich) {
  const source = rich ? preview : document.createElement('textarea');
  if (!rich) {
    source.value = content;
    source.style.cssText = 'position:fixed;left:-200vw';
    document.body.append(source);
    source.select();
  } else {
    const range = document.createRange();
    range.selectNodeContents(source);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
  try {
    if (!document.execCommand('copy')) throw new Error('Copy unavailable');
  } finally {
    if (rich) window.getSelection().removeAllRanges();
    else source.remove();
  }
}

async function copy(kind) {
  const rich = kind === 'html';
  const plain = kind === 'subject' ? get('subject').textContent : textBody();
  try {
    try {
      if (rich) {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([preview.innerHTML], {type:'text/html'}),
          'text/plain': new Blob([plain], {type:'text/plain'})
        })]);
      } else await navigator.clipboard.writeText(plain);
    } catch {
      legacyCopy(plain, rich);
    }
    status.textContent = kind === 'subject' ? '件名をコピーしました。' : '本文をコピーしました。メールの作成画面に貼り付けてください。';
  } catch {
    status.textContent = 'コピーできませんでした。画面の件名またはプレビュー本文を選択してコピーしてください。';
  }
}
form.addEventListener('submit', event => event.preventDefault());
form.addEventListener('input', render);
form.addEventListener('reset', () => requestAnimationFrame(render));
get('copy-subject').addEventListener('click', () => copy('subject'));
get('copy-body').addEventListener('click', () => copy('html'));
get('copy-text').addEventListener('click', () => copy('text'));
render();
</script></body></html>
